<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        <h1>Odin Library</h1>
        <div class="addbookformdiv">
            <div class="main-content">
                <button class="add-book-btn">Add Book</button>
            </div>

                <form action="#" class="addbookform">
                    <div>
                        <label for="title">Title </label>
                        <input type="text" id="title" required>
                    </div>
                    <div>
                        <label for="author">Author </label>
                        <input type="text" id="author" required>
                    </div>
                    <div>
                        <label for="pages">Number of Pages </label>
                        <input type="text" id="pages" required>
                    </div>
                    <div>
                        <input type="radio" name="choice" id="read" required checked>
                        <label for="readornot">Read</label>
                        <input type="radio" name="choice" id="notread">
                        <label for="notread">Not Read</label>
                    </div>
                    <div>
                        <input type="submit" value="Add" class="add-book-btn-final">
                    </div>
                </form>
        </div>

        <div class="display-cards"></div>
    </div>
</body>
</html>
